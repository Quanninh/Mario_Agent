<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1560" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="25" y="20" width="800" height="60" rx="8" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="425" y="56" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold" letter-spacing="0.5">Activity Diagram: Reinforcement Learning Training Lifecycle (SOLID)</text>

  <!-- Start Node -->
  <circle cx="425" cy="120" r="16" fill="#10b981" stroke="#059669" stroke-width="3"/>
  <text x="425" y="125" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">START</text>
  <line x1="425" y1="136" x2="425" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: Config -->
  <rect x="275" y="160" width="300" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="187" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Load Configuration &amp; Hyperparameters</text>
  <line x1="425" y1="204" x2="425" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Dependency Injection -->
  <rect x="235" y="228" width="380" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="250" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Instantiate Subsystems (SOLID Dependency Injection)</text>
  <text x="425" y="268" text-anchor="middle" fill="#64748b" font-size="11">Environment, Discretizer, RewardStrategy &amp; QLearningAgent</text>
  <line x1="425" y1="280" x2="425" y2="308" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Outer Episode Frame -->
  <rect x="60" y="308" width="730" height="950" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="80" y="296" width="170" height="24" rx="6" fill="#2563eb"/>
  <text x="165" y="312" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">EPISODE LOOP</text>

  <!-- Episode Start: Reset -->
  <rect x="260" y="335" width="330" height="46" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="355" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Reset Environment &amp; Get Raw State</text>
  <text x="425" y="371" text-anchor="middle" fill="#64748b" font-size="11">Initialize player at start, clear velocities, score = 0</text>
  <line x1="425" y1="381" x2="425" y2="405" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Discretize Initial State -->
  <rect x="260" y="405" width="330" height="46" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="425" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Discretizer: Compute Initial State s</text>
  <text x="425" y="441" text-anchor="middle" fill="#64748b" font-size="11">Convert continuous coordinates into discrete feature tuple</text>
  <line x1="425" y1="451" x2="425" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Inner Step Frame -->
  <rect x="90" y="480" width="670" height="570" rx="14" fill="#f0fdf4" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="110" y="468" width="150" height="24" rx="6" fill="#059669"/>
  <text x="185" y="484" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">GAME STEP LOOP</text>

  <!-- Step: Select Action -->
  <rect x="245" y="505" width="360" height="48" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="526" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">QLearningAgent: Select Action a</text>
  <text x="425" y="543" text-anchor="middle" fill="#059669" font-size="11" font-weight="500">Epsilon-Greedy: Random (explore) vs max Q(s, a) (exploit)</text>
  <line x1="425" y1="553" x2="425" y2="578" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: Environment Step -->
  <rect x="245" y="578" width="360" height="48" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="599" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">MarioEnvironment: Step Physics &amp; Collisions</text>
  <text x="425" y="616" text-anchor="middle" fill="#64748b" font-size="11">Apply action (Run/Jump/Stay), update positions &amp; checks</text>
  <line x1="425" y1="626" x2="425" y2="652" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: Collect Events -->
  <rect x="245" y="652" width="360" height="46" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="672" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Collect Transition Events</text>
  <text x="425" y="688" text-anchor="middle" fill="#64748b" font-size="11">Progress dx, Death flag, Goal flag, Coin pickup</text>

  <!-- Fork lines to parallel calculation -->
  <path d="M 425 698 L 425 718 L 270 718 L 270 735" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 425 698 L 425 718 L 580 718 L 580 735" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Left: Reward Calc -->
  <rect x="130" y="735" width="280" height="52" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="270" y="756" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">RewardStrategy: Compute r</text>
  <text x="270" y="774" text-anchor="middle" fill="#d97706" font-size="11">+dx progress, -penalties, +goal</text>

  <!-- Right: Next State Calc -->
  <rect x="440" y="735" width="280" height="52" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="756" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Discretizer: Compute s'</text>
  <text x="580" y="774" text-anchor="middle" fill="#7c3aed" font-size="11">Map new coords to next state tuple</text>

  <!-- Join lines to Q-Update -->
  <path d="M 270 787 L 270 808 L 425 808 L 425 825" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 787 L 580 808 L 425 808" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Step: Q-Learning Bellman Update -->
  <rect x="170" y="825" width="510" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="848" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">QLearningAgent: Bellman TD Update</text>
  <text x="425" y="868" text-anchor="middle" fill="#b91c1c" font-size="12" font-family="monospace">Q(s, a) &lt;- Q(s, a) + alpha * [r + gamma * max Q(s', a') - Q(s, a)]</text>
  <line x1="425" y1="881" x2="425" y2="908" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: Advance State -->
  <rect x="260" y="908" width="330" height="40" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="933" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Accumulate Reward &amp; Transition: s &lt;- s'</text>
  <line x1="425" y1="948" x2="425" y2="975" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Diamond: Step Done? -->
  <polygon points="425,975 495,1005 425,1035 355,1005" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="1002" text-anchor="middle" fill="#854d0e" font-size="11" font-weight="bold">Done?</text>
  <text x="425" y="1015" text-anchor="middle" fill="#854d0e" font-size="9">(Goal/Death/Timeout)</text>

  <!-- Loopback Arrow for Step: No -->
  <path d="M 355 1005 L 110 1005 L 110 529 L 243 529" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="130" y="995" fill="#059669" font-size="12" font-weight="bold">[No: Continue Step]</text>

  <!-- Exit Step: Yes -->
  <line x1="425" y1="1035" x2="425" y2="1070" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="1055" fill="#475569" font-size="11" font-weight="bold">[Yes: Episode Finished]</text>

  <!-- End of Episode Steps -->
  <rect x="260" y="1070" width="330" height="44" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="1091" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Log Episode Telemetry</text>
  <text x="425" y="1106" text-anchor="middle" fill="#64748b" font-size="11">Total Reward, Steps Count, Win/Loss, Max Distance</text>
  <line x1="425" y1="1114" x2="425" y2="1138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="1138" width="330" height="44" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="1158" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Decay Exploration Rate (Epsilon)</text>
  <text x="425" y="1174" text-anchor="middle" fill="#2563eb" font-size="11" font-family="monospace">epsilon &lt;- max(epsilon_min, epsilon * decay)</text>
  <line x1="425" y1="1182" x2="425" y2="1210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Diamond: All Episodes Done? -->
  <polygon points="425,1210 505,1242 425,1274 345,1242" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="1239" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">All Episodes</text>
  <text x="425" y="1252" text-anchor="middle" fill="#1e40af" font-size="9">Completed?</text>

  <!-- Loopback Arrow for Episode: No -->
  <path d="M 345 1242 L 75 1242 L 75 358 L 258 358" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="85" y="1232" fill="#2563eb" font-size="12" font-weight="bold">[No: Next Episode]</text>

  <!-- Exit Episode: Yes -->
  <line x1="425" y1="1274" x2="425" y2="1305" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="1293" fill="#475569" font-size="11" font-weight="bold">[Yes: Training Done]</text>

  <!-- Post-Training / Deliverables -->
  <rect x="215" y="1305" width="420" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="1328" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Save Artifacts &amp; Checkpoints</text>
  <text x="425" y="1346" text-anchor="middle" fill="#64748b" font-size="11">Save Q-Table (.npy), Export training logs (.csv)</text>
  <line x1="425" y1="1361" x2="425" y2="1388" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="190" y="1388" width="470" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="1411" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">Evaluation &amp; Performance Reporting</text>
  <text x="425" y="1429" text-anchor="middle" fill="#64748b" font-size="11">Plot learning curves, run greedy demo (epsilon = 0), test generalization</text>
  <line x1="425" y1="1444" x2="425" y2="1472" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End Node -->
  <circle cx="425" cy="1492" r="20" fill="#10b981" stroke="#059669" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="425" cy="1492" r="13" fill="#ffffff"/>
  <circle cx="425" cy="1492" r="8" fill="#10b981"/>
  <text x="425" y="1530" text-anchor="middle" fill="#059669" font-size="13" font-weight="bold">Deliverables Ready (Finished)</text>
</svg>